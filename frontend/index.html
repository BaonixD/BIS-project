<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=tulpar" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=tulpar" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="TulparTaxi" />
    <meta name="theme-color" content="#f6f6f6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TulparTaxi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="TulparTaxi — такси в Алматы. Заказ поездок и работа водителем." />
    <title>TulparTaxi</title>
    <script>
      try {
        var choice = localStorage.getItem('tezjet.theme') || 'system'
        var dark =
          choice === 'dark' ||
          (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#0d0f10'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
